services:
  iam:
    build:
      context: ./iam
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    networks: [iam-net, bus]
    environment:
      DB_HOST: iam_db
      DB_PORT: 5432
      DB_USER: iam
      DB_PASSWORD: iam
      DB_NAME: iam
    depends_on:
      iam_db:
        condition: service_healthy
      iam_redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  iam_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam
      POSTGRES_DB: iam
    ports:
      - "5434:5432"
    volumes:
      - iam_db_data:/var/lib/postgresql/data
    networks: [iam-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam -d iam"]
      interval: 5s
      timeout: 3s
      retries: 10

  iam_redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - iam_redis_data:/data
    networks: [iam-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  iam_adminer:
    image: adminer:4
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: iam_db
    networks: [iam-net]
    depends_on:
      - iam_db

volumes:
  iam_db_data:
  iam_redis_data:

networks:
  iam-net:
    driver: bridge
  bus:
    driver: bridge
