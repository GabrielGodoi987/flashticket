spring.application.name=payment

# Banco — valores padrão para rodar pela IDE (localhost:5433); no container vêm das variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/payment}
spring.datasource.username=${DB_USER:payment}
spring.datasource.password=${DB_PASSWORD:payment}

# Schema é responsabilidade do Flyway (src/main/resources/db/migration); o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:bilheteria}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:bilheteria}

# Actuator: expõe só o health, sem detalhes internos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Não vazar detalhes de erro nas respostas
server.error.include-stacktrace=never
server.error.include-message=never
