services:
  reservations:
    build:
      context: ./reservations
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    networks: [reservations-net, bus]
    environment:
      DB_HOST: reservations_db
      DB_PORT: 5432
      DB_USER: reservations
      DB_PASSWORD: reservations
      DB_NAME: reservations
    depends_on:
      reservations_db:
        condition: service_healthy
      reservations_redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reservations_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: reservations
      POSTGRES_DB: reservations
    ports:
      - "5432:5432"
    volumes:
      - reservations_db_data:/var/lib/postgresql/data
    networks: [reservations-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations -d reservations"]
      interval: 5s
      timeout: 3s
      retries: 10

  reservations_redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - reservations_redis_data:/data
    networks: [reservations-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  reservations_adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: reservations_db
    networks: [reservations-net]
    depends_on:
      - reservations_db

volumes:
  reservations_db_data:
  reservations_redis_data:

networks:
  reservations-net:
    driver: bridge
  bus:
    driver: bridge
