services:
  reservas:
    build:
      context: ./reservas
      dockerfile: Dockerfile
    networks: [reservas-net, bus]
    environment:
      DB_HOST: reservas_db
      DB_PORT: 5432
      DB_USER: reservas
      DB_PASSWORD: reservas
      DB_NAME: reservas
    depends_on:
      reservas_db:
        condition: service_healthy
      reservas_redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reservas_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
      POSTGRES_DB: reservas
    ports:
      - "5432:5432"
    volumes:
      - reservas_db_data:/var/lib/postgresql/data
    networks: [reservas-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 5s
      timeout: 3s
      retries: 10

  reservas_redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - reservas_redis_data:/data
    networks: [reservas-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  reservas_adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: reservas_db
    networks: [reservas-net]
    depends_on:
      - reservas_db

volumes:
  reservas_db_data:
  reservas_redis_data:

networks:
  reservas-net:
    driver: bridge
  bus:
    driver: bridge
